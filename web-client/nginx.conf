# Client web Angular (D51) : servi derrière la gateway, port interne 4200
server {
    listen 4200;
    server_name _;
    root /usr/share/nginx/html;

    # Fichiers à nom haché (main-XXXX.js…) : mis en cache longtemps
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Référentiel copié du seed : toujours revalidé
    location /seed/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Routes Angular (/connexion, /patient/…, /medecin/…, /admin) : repli sur index.html, jamais mis en cache
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
