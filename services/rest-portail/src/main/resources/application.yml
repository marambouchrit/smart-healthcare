server:
  port: 8082

spring:
  application:
    name: rest-portail
  mvc:
    # Erreurs standard (400, 404, 405…) au format Problem Details, comme le contrat OpenAPI
    problemdetails:
      enabled: true

portail:
  # Les plannings de contracts/seed sont en heure locale tunisienne
  fuseau: Africa/Tunis
  # Nombre de jours de créneaux générés à partir d'aujourd'hui
  horizon-jours: 14

logging:
  level:
    tn.ginf.smarthealthcare.rest: INFO
