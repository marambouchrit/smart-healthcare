server:
  port: 8082

spring:
  application:
    name: rest-portail
  mvc:
    # Erreurs standard (400, 404, 405…) au format Problem Details, comme le contrat OpenAPI
    problemdetails:
      enabled: true
  # Base PostgreSQL du service (D8, D35) : conteneur « postgres » de docker-compose.yml, port hôte 5433
  datasource:
    url: ${PORTAIL_DB_URL:jdbc:postgresql://localhost:5433/rest_portail}
    username: ${PORTAIL_DB_USER:rest_portail}
    password: ${PORTAIL_DB_PASSWORD:rest_portail_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    # Messages de validation en français quel que soit l'OS (poste Windows ou conteneur Linux)
    locale: fr
    locale-resolver: fixed

# Swagger UI (http://localhost:8082/swagger-ui.html) affiche le CONTRAT, pas une description régénérée ;
# /v3/api-docs (généré depuis le code) sert à vérifier l'alignement code ↔ contrat (AlignementContratTest).
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi/portail-openapi.yaml
  api-docs:
    path: /v3/api-docs

portail:
  # Les plannings de contracts/seed sont en heure locale tunisienne
  fuseau: Africa/Tunis
  # Nombre de jours de créneaux générés à partir d'aujourd'hui
  horizon-jours: 14

logging:
  level:
    tn.ginf.smarthealthcare.rest: INFO
